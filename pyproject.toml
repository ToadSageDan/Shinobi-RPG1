[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shinobi-rpg"
version = "0.1.0"
description = "Lightweight MVP foundation for a ninja-inspired open-world RPG."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["rpg", "ninja", "game", "shinobi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Role-Playing",
]

[project.urls]
Homepage = "https://github.com/ToadSageDan/Shinobi-RPG1"
Issues = "https://github.com/ToadSageDan/Shinobi-RPG1/issues"

[project.scripts]
shinobi-rpg = "shinobi_rpg.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shinobi_rpg*"]

[tool.coverage.run]
source = ["shinobi_rpg"]

[tool.coverage.report]
fail_under = 80
show_missing = true
